<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src blob:; connect-src 'none'; form-action 'self'; upgrade-insecure-requests">
  <title>Gefaz360 — Gestão da Fazenda</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Ir para o conteúdo principal</a>
  <div id="app">
    <aside aria-label="Navegação do sistema">
      <div class="logo">Ge<b>faz</b>360<small>Gestão da Fazenda</small></div>
      <div id="safraBox" class="safra-box"></div>
      <nav id="nav" aria-label="Módulos do Gefaz360"></nav>
    </aside>
    <main id="main" tabindex="-1"><p role="status">Carregando dados da fazenda…</p></main>
  </div>
  <div id="app-status" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  <div id="tip" role="tooltip"></div>
  <div id="print-area"></div>
  <div id="docview" role="dialog" aria-modal="true" aria-labelledby="docview-nome" aria-hidden="true">
    <div class="box">
      <header><span id="docview-nome"></span>
        <button class="btn mini ghost" data-action="fecha-doc" type="button" aria-label="Fechar visualização do documento">✕ Fechar</button>
      </header>
      <div id="docview-body"></div>
    </div>
  </div>
  <noscript>O Gefaz360 precisa de JavaScript habilitado para funcionar.</noscript>
</body>
</html>
